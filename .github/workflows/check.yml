name: Public checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate public export
        run: python3 scripts/check.py
      - name: Check shell examples
        run: sh -n examples/curl/query.sh && sh -n examples/curl/contribute.sh
      - name: Verify receipt conformance offline
        working-directory: examples/receipt-verifier
        run: |
          go version
          go mod download
          GOPROXY=off go test -v ./...
