name: Public checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate public export
        run: python3 scripts/check.py
      - name: Check shell examples
        run: sh -n examples/curl/query.sh && sh -n examples/curl/contribute.sh
      - name: Verify receipt conformance offline
        working-directory: examples/receipt-verifier
        run: |
          go version
          go mod download
          GOPROXY=off go test -v ./...
